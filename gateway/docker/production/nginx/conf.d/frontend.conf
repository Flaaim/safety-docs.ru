server {
  listen 80;
  server_name iot-1.ru www.iot-1.ru
  server_tokens off;

  include /etc/nginx/snippets/certbot.conf;

  rewrite ^(.*) https://iot-1.ru$1 permanent;
}


 server {
    listen 443 ssl http2;
    server_name www.iot-1.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/iot-1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-1.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/iot-1.ru/chain.pem;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/certbot.conf;
    rewrite ^(.*) https://iot-1.ru$1 permanent;
 }

 server {
     listen 443 ssl http2;
     server_name iot-1.ru;
     server_tokens off;

     ssl_certificate /etc/letsencrypt/live/iot-1.ru/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/iot-1.ru/privkey.pem;
     ssl_trusted_certificate /etc/letsencrypt/live/iot-1.ru/chain.pem;

     include /etc/nginx/snippets/ssl.conf;
     include /etc/nginx/snippets/certbot.conf;

     location / {
proxy_set_header  Host $host;
      proxy_set_header  X-Real-IP $remote_addr;
      proxy_set_header  X-Forwarded-Proto https;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header  Upgrade $http_upgrade;
      proxy_set_header  Connection "upgrade";

      proxy_pass        http://frontend-node:3000;
      proxy_redirect    off;
     }

     location /_next/static/ {
             proxy_pass http://frontend-node:3000;
             proxy_cache_bypass $http_upgrade;
             expires 365d;
             access_log off;
          }
  }
