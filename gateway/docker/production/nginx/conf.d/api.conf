server {
     listen 80;
     server_name api.iot-1.ru;
     server_tokens off;
     client_max_body_size 10M;
     include /etc/nginx/snippets/certbot.conf;

     rewrite ^(.*) https://api.iot-1.ru$1 permanent;
 }

 server {
     listen 443 ssl http2;
     server_name api.iot-1.ru;
     server_tokens off;
     client_max_body_size 10M;
     ssl_certificate /etc/letsencrypt/live/api.iot-1.ru/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/api.iot-1.ru/privkey.pem;
     ssl_trusted_certificate /etc/letsencrypt/live/api.iot-1.ru/chain.pem;

     include /etc/nginx/snippets/ssl.conf;
     include /etc/nginx/snippets/certbot.conf;

     location / {
add_header 'Access-Control-Allow-Origin' 'https://iot-1.ru' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Обработка предварительного (preflight) запроса OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://iot-1.ru' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $remote_addr;
        proxy_set_header X-NginX-Proxy true;

        proxy_pass http://api;
        proxy_ssl_session_reuse off;
        proxy_redirect off;
     }
 }
